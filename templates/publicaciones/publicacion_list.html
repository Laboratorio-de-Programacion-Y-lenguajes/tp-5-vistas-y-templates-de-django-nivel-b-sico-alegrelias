{% extends "base.html" %}

{% block content %}
    <h2>Lista de Publicaciones</h2>
    {% for pub in publicacion_list %}
    <p><a href="{% url 'publicaciones:detalle_publicacion' pub.pk %}">
        {{ pub.titulo }}
        {{ pub.autor }}
        {{ pub.fecha_publicacion }}</a></p>
    {% empty %}
            <p>No hay publicaciones disponibles aún.</p>
    {% endfor %}
{% endblock %}
